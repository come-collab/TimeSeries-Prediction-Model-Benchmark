server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # (add_header in a location replaces the server-level ones, so they are repeated)
    # data.json changes on every benchmark run: always revalidate.
    location = /data.json { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
    location ~* \.(css|js|svg)$ { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; }

    location / { try_files $uri $uri/ /index.html; }
}
